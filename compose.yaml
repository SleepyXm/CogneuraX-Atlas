name: cogneurax-atlas

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-atlas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  embeddings:
    # Override TEI_IMAGE with cpu-1.9 on an x86_64 host. This pinned default
    # matches the Apple Silicon development machine used by this repository.
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest@sha256:35c50d7494de22deecdb783b8f5b7e1d05765709bd90071b03469b9440d28656}
    command: ["--model-id", "${EMBED_MODEL:-BAAI/bge-small-en-v1.5}", "--port", "80"]
    ports:
      - "8081:80"
    volumes:
      - tei_model_cache:/data
    restart: unless-stopped

  processor:
    build: ./processor
    environment:
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      ATLAS_REGION_MAX_TOKENS: "${ATLAS_REGION_MAX_TOKENS:-128}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/openapi.json')"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - processor_model_cache:/root/.cache
    restart: unless-stopped

  data-init:
    image: busybox:1.37
    command: ["sh", "-c", "mkdir -p /data/documents && chown -R 65532:65532 /data"]
    volumes:
      - atlas_data:/data
    restart: "no"

  atlas:
    build: .
    environment:
      DATABASE_URL: postgres://atlas:atlas@postgres:5432/atlas?sslmode=disable
      ATLAS_ADDR: :8090
      ATLAS_SERVICE_TOKEN: ${ATLAS_SERVICE_TOKEN:-local-development-token}
      ATLAS_INDEX_VERSION: ${ATLAS_INDEX_VERSION:-v2}
      ATLAS_PROCESSOR_URL: http://processor:5001
      ATLAS_STORAGE: local
      ATLAS_DATA_DIR: /data/documents
      ATLAS_MAX_UPLOAD_BYTES: ${ATLAS_MAX_UPLOAD_BYTES:-104857600}
      ATLAS_INGESTION_ATTEMPTS: ${ATLAS_INGESTION_ATTEMPTS:-3}
      ATLAS_DENSE_THRESHOLD: ${ATLAS_DENSE_THRESHOLD:-0.55}
      ATLAS_SPARSE_THRESHOLD: ${ATLAS_SPARSE_THRESHOLD:-5.0}
      QDRANT_HOST: qdrant
      QDRANT_GRPC_PORT: 6334
      QDRANT_DENSE_COLLECTION: ${QDRANT_DENSE_COLLECTION:-atlas_dense_regions_v2}
      QDRANT_SPARSE_COLLECTION: ${QDRANT_SPARSE_COLLECTION:-atlas_sparse_regions_v2}
      TEI_URL: http://embeddings:80
      TEI_EMBEDDING_DIMENSION: ${TEI_EMBEDDING_DIMENSION:-384}
      TEI_QUERY_PREFIX: "${TEI_QUERY_PREFIX:-Represent this sentence for searching relevant passages: }"
    ports:
      - "8090:8090"
    volumes:
      - atlas_data:/data/documents
    depends_on:
      data-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      embeddings:
        condition: service_started
      processor:
        condition: service_healthy
    restart: unless-stopped

volumes:
  atlas_data:
  postgres_data:
  processor_model_cache:
  qdrant_data:
  tei_model_cache:
